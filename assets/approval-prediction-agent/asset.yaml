apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: approval-prediction-agent

provides:
  apis:
    - name: approval-prediction-agent
      kind: a2a
      ordId: customer.build:apiResource:approval-prediction-agent-bb341.approval-prediction-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-s4-reg-assessment-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:approval-prediction-agent-bb341.sap-s4-reg-assessment-mcp-server:v1
  - name: sap-ariba-approval-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:approval-prediction-agent-bb341.sap-ariba-approval-mcp-server:v1

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
